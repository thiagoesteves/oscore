name: OSCORE CI

on:
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  SHELL: /usr/bin/bash

jobs:
  rust-test:
    name: Rust Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/oscore_nif/target
          key: oscore-nif-${{ hashFiles('native/oscore_nif/Cargo.lock') }}

      - name: cargo test
        working-directory: native/oscore_nif
        run: cargo test

      - name: cargo fmt --check
        working-directory: native/oscore_nif
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: native/oscore_nif
        run: cargo clippy -- -D warnings

  setup:
    name: Setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            deps
            native/oscore_nif/target
          key: |
            oscore-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}-2026-07-27
          restore-keys: |
            oscore-

      - name: Install Elixir dependencies
        run: mix do deps.get + compile --warnings-as-errors

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            deps
            native/oscore_nif/target
          key: |
            oscore-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}-2026-07-27
          restore-keys: |
            oscore-

      - name: Run tests
        run: mix test --cover

  analysis:
    name: Static Analysis
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            deps
            native/oscore_nif/target
          key: |
            oscore-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}-2026-07-27
          restore-keys: |
            oscore-

      - name: Install Elixir dependencies
        run: mix do deps.get + compile --warnings-as-errors

      - name: Run mix deps.unlock
        run: mix deps.unlock --check-unused

      - name: Mix Audit
        run: mix deps.audit

      - name: Ex Doc
        run: mix docs --failed

      - name: Formatted
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Restore PLT cache
        uses: actions/cache/restore@v4
        id: plt_cache
        with:
          key: |
            oscore-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}-2026-07-27
          restore-keys: |
            oscore-
          path: |
            priv/plts

      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLT cache
        uses: actions/cache/save@v4
        if: steps.plt_cache.outputs.cache-hit != 'true'
        id: plt_cache_save
        with:
          key: |
            ${{ runner.os }}-elixir-1.19.1-otp-28-plt
          path: |
            priv/plts

      - name: Run dialyzer
        run: mix dialyzer --format github --format dialyxir
